[workspace]
resolver = "2"
members = ["crates/core", "crates/translate", "crates/plugin-host", "app"]
exclude = ["plugins/example-translate", "frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
scholarust-core = { path = "crates/core" }
scholarust-translate = { path = "crates/translate" }
scholarust-plugin-host = { path = "crates/plugin-host" }

[profile.release]
lto = "thin"
strip = true